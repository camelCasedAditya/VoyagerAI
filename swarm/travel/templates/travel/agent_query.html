<html>
<head>
    <title>Agent Query</title> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body class="px-5" style="background-color: #121212;">
    <header>
        <!-- <nav class="p-2"> -->
            <div class="container-fluid d-flex justify-content-center py-3">
                <div class="badge rounded-pill py-3 px-2 shadow" style="background-color: #444444;">
                    <ul class="navbar-nav flex-row m-0">
                        <li class="nav-item mx-2">
                            <a class="nav-link p-0" href="#"><span class="badge rounded-pill bg-light px-3 py-2 text-dark" style="font-size: medium; transition: all 0.3s ease; cursor: pointer;" onmouseover="this.style.backgroundColor='#e0e0e0'; this.style.transform='scale(1.1)'" onmouseout="this.style.backgroundColor=''; this.style.transform='scale(1)'">Home</span></a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link p-0" href="#"><span class="badge rounded-pill bg-dark px-3 py-2 text-white" style="font-size: medium; transition: all 0.3s ease; cursor: pointer;" onmouseover="this.style.backgroundColor='#495057'; this.style.transform='scale(1.1)'" onmouseout="this.style.backgroundColor=''; this.style.transform='scale(1)'">Link</span></a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link p-0" href="#"><span class="badge rounded-pill bg-dark px-3 py-2 text-white" style="font-size: medium; transition: all 0.3s ease; cursor: pointer;" onmouseover="this.style.backgroundColor='#495057'; this.style.transform='scale(1.1)'" onmouseout="this.style.backgroundColor=''; this.style.transform='scale(1)'">Action</span></a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link p-0" href="#"><span class="badge rounded-pill bg-dark px-3 py-2 text-white" style="font-size: medium; transition: all 0.3s ease; cursor: pointer;" onmouseover="this.style.backgroundColor='#495057'; this.style.transform='scale(1.1)'" onmouseout="this.style.backgroundColor=''; this.style.transform='scale(1)'">Another</span></a>
                        </li>
                        <li class="nav-item mx-2">
                            <a class="nav-link p-0" href="#"><span class="badge rounded-pill bg-dark px-3 py-2 text-white" style="font-size: medium; transition: all 0.3s ease; cursor: pointer;" onmouseover="this.style.backgroundColor='#495057'; this.style.transform='scale(1.1)'" onmouseout="this.style.backgroundColor=''; this.style.transform='scale(1)'">Contact</span></a>
                        </li>
                    </ul>
                </div>
            </div>
        <!-- </nav> -->
    </header>
    <div class="container justify-content-center">
        <div class="row justify-content-center">
            <h1 style="color: #E0E0E0;">Agent Query</h1>
        </div>
        <div class="row justify-content-center">
            <div class="col-auto">
                <p style="color: #E0E0E0;">Use the form below to submit your query to the agent.</p>
                <form method="post">
                    <!-- {% csrf_token %} -->
                    <label for="query" style="color: #E0E0E0">Enter your query:</label><br>
                    <input class="w-100 rounded" id="query" name="query" rows="4" cols="50"></input><br>
                    <button type="submit">Submit</button>
                </form>
            </div>
        </div>
    </div>
    
    

    

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit</button>
    </form>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</body>
</html>
